name: BecaWork Logtime

on:
  push:
    paths:
      - "skills/beca-logtime/**"
      - ".github/workflows/beca-logtime.yml"
  pull_request:
    paths:
      - "skills/beca-logtime/**"
      - ".github/workflows/beca-logtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show environment
        run: python -c "import platform, sys; print(platform.platform()); print(sys.version)"

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python skills/beca-logtime/scripts/test_beca_logtime.py

      - name: Compile CLI
        run: python -m py_compile skills/beca-logtime/scripts/beca_logtime.py

      - name: Smoke-test managed keyring dependency
        run: |
          python -m pip install --disable-pip-version-check --target .keyring-smoke "keyring>=25,<26"
          python -c "import sys; sys.path.insert(0, '.keyring-smoke'); import keyring; print(keyring.__version__ if hasattr(keyring, '__version__') else keyring.__name__)"

      - name: Smoke-test public CLI
        run: |
          python skills/beca-logtime/scripts/beca_logtime.py version --json
          python skills/beca-logtime/scripts/beca_logtime.py --help
